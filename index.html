<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自称年収シミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="badge">ネタ用・実収入ではありません</p>
      <h1>自称年収シミュレーター</h1>
      <p class="lead">
        仮想ポイントをぐるぐる回して、口頭ネタ用の「自称年収」を表示するだけのサイトです。
        実際の収入・売上・所得・納税額を示すものではありません。
      </p>
    </section>

    <section class="card">
      <label for="nickname">名前・ニックネーム</label>
      <input id="nickname" type="text" placeholder="例：ゆうと" maxlength="30">

      <label for="loops">疑似取引回数</label>
      <input id="loops" type="number" min="1" max="100000000" value="1000000">

      <label for="unit">1回あたりのネタ取引額</label>
      <select id="unit">
        <option value="1">1円</option>
        <option value="10">10円</option>
        <option value="100">100円</option>
        <option value="1000">1,000円</option>
        <option value="10000">10,000円</option>
      </select>

      <button id="calcButton" type="button">自称年収を生成</button>
    </section>

    <section class="result card" aria-live="polite">
      <p class="small">あなたの自称年収</p>
      <div id="resultAmount">---</div>
      <p id="resultText" class="result-text">数値を入力して生成してください。</p>
    </section>

    <section class="warning">
      <h2>重要な注意</h2>
      <ul>
        <li>このサイトはジョーク用です。</li>
        <li>実際の年収・売上・所得・利益・納税額を示すものではありません。</li>
        <li>信用審査、契約、税務申告、就職、融資、商談などには使えません。</li>
        <li>実決済、領収書、請求書、収入証明書の生成機能はありません。</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 自称年収シミュレーター / Joke only</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
